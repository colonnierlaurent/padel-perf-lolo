<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCL — Scan terrain</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f3f1;color:#202124}.head{background:#171717;color:#fff;border-bottom:6px solid #ffd400;padding:16px;text-align:center}.logo{background:white;border-radius:8px;padding:4px;display:flex;align-items:center;justify-content:center}.logo img{display:block;width:92px;height:auto}.wrap{max-width:520px;margin:auto;padding:18px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode button{padding:14px;border:1px solid #ddd;background:#fff;border-radius:10px;font-weight:900}.mode .on{background:#ffd400;border-color:#ffd400}.card{background:#fff;border-radius:16px;padding:20px;margin-top:16px;border:1px solid #ddd;text-align:center}.scanbox{height:220px;border:3px dashed #bbb;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:15px 0}.scanbox b{font-size:24px}.scan{width:100%;background:#171717;color:#fff;border:0;border-radius:10px;padding:16px;font-weight:900;font-size:16px}.manual{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;margin-top:10px}.result{margin-top:16px;background:#e4f5e7;border-radius:13px;padding:18px;text-align:left}.result h2{margin:0 0 7px;color:#1f7436}.dest{font-size:28px;font-weight:900}.small{font-size:13px;color:#68707c;margin-top:7px}.warning{background:#ffe0e0}.warning h2{color:#a01818}@media(min-width:700px){body{padding-top:20px}}</style></head><body><div class="head"><div class="logo"><img src="Logo_CCL_2023.png" alt="CCL"></div><div style="font-weight:900">SCAN TERRAIN</div><div style="font-size:12px;color:#bbb">Chargement & Réception</div></div><div class="wrap"><div class="mode"><button class="on">CHARGEMENT</button><button>RÉCEPTION</button></div><div class="card"><b>Scanner l'unité logistique</b><div class="scanbox"><b>▦ QR / CODE 128</b><div class="small">Caméra téléphone ou bipette</div></div><button class="scan" id="scan">SIMULER UN SCAN</button><input class="manual" placeholder="Ou saisir l'identifiant manuellement"></div><div class="result" id="res"><h2>✓ CHARGEMENT AUTORISÉ</h2><div class="dest">CASTRES</div><b>UL-4587564-03</b><div class="small">Transfert 4587564 • Colis 3/5<br>Destination finale : CASTRES<br>Scan horodaté automatiquement</div></div></div><script>const modes=document.querySelectorAll('.mode button');modes.forEach(b=>b.onclick=()=>{modes.forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('.card>b').textContent=b.textContent==='RÉCEPTION'?'Scanner au déchargement / réception':'Scanner l’unité logistique'});document.getElementById('scan').onclick=()=>document.getElementById('res').style.display='block';</script></body></html>
